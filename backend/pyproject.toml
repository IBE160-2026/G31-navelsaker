[project]
name = "rbe"
version = "0.1.0"
description = "Red Ball Express: MRP for skipsbygging (backend)"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.165.0",
    "pydantic-settings==2.16.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
